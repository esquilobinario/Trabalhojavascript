<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Exercicios JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .botoes-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Lista de Exercícios JavaScript</h1>
    <p style="text-align: center;">Clique no botão correspondente para testar o exercício:</p>

    <div class="botoes-container">
        <button onclick="ex01()">Exercício 01</button>
        <button onclick="ex02()">Exercício 02</button>
        <button onclick="ex03()">Exercício 03</button>
        <button onclick="ex04()">Exercício 04</button>
        <button onclick="ex05()">Exercício 05</button>
        <button onclick="ex06()">Exercício 06</button>
        <button onclick="ex07()">Exercício 07</button>
        <button onclick="ex08()">Exercício 08</button>
        <button onclick="ex09()">Exercício 09</button>
        <button onclick="ex10()">Exercício 10</button>
        <button onclick="ex11()">Exercício 11</button>
        <button onclick="ex12()">Exercício 12</button>
        <button onclick="ex13()">Exercício 13</button>
        <button onclick="ex14()">Exercício 14</button>
        <button onclick="ex15()">Exercício 15</button>
        <button onclick="ex16()">Exercício 16</button>
        <button onclick="ex17()">Exercício 17</button>
        <button onclick="ex18()">Exercício 18</button>
        <button onclick="ex19()">Exercício 19</button>
        <button onclick="ex20()">Exercício 20</button>
    </div>

    <script>
        function ex01() {
            let num = parseInt(prompt("Ex 1 - Antecessor e Sucessor:\nDigite um numero:"));
            let antecessor = num - 1;
            let sucessor = num + 1;
            alert("Antecessor: " + antecessor + "\nSucessor: " + sucessor);
        }

        function ex02() {
            let n1 = parseFloat(prompt("Ex 2 - Quatro operacoes:\nDigite o primeiro numero:"));
            let n2 = parseFloat(prompt("Digite o segundo numero:"));
            alert("Soma: " + (n1 + n2) + "\nSubtracao: " + (n1 - n2) + "\nMultiplicacao: " + (n1 * n2) + "\nDivisao: " + (n1 / n2));
        }

        function ex03() {
            let n1 = parseFloat(prompt("Ex 3 - Media de notas:\nDigite a 1a nota:"));
            let n2 = parseFloat(prompt("Digite a 2a nota:"));
            let n3 = parseFloat(prompt("Digite a 3a nota:"));
            let media = (n1 + n2 + n3) / 3;
            alert("Media: " + media.toFixed(2));
        }

        function ex04() {
            let largura = parseFloat(prompt("Ex 4 - Area do retangulo:\nDigite a largura:"));
            let altura = parseFloat(prompt("Digite a altura:"));
            alert("Area: " + (largura * altura));
        }

        function ex05() {
            let c = parseFloat(prompt("Ex 5 - Conversao de temperatura:\nDigite em Celsius:"));
            let f = (c * 9 / 5) + 32;
            alert("Fahrenheit: " + f);
        }

        function ex06() {
            let num = parseFloat(prompt("Ex 6 - Positivo, negativo ou zero:\nDigite um numero:"));
            if (num > 0) {
                alert("Positivo");
            } else if (num < 0) {
                alert("Negativo");
            } else {
                alert("Igual a zero");
            }
        }

        function ex07() {
            let idade = parseInt(prompt("Ex 7 - Maior de idade:\nDigite a idade:"));
            if (idade >= 18) {
                alert("Maior de idade");
            } else {
                alert("Menor de idade");
            }
        }

        function ex08() {
            let num = parseInt(prompt("Ex 8 - Par ou impar:\nDigite um numero inteiro:"));
            // Correção feita aqui: de "=" para "==="
            if (num % 2 === 0) {
                alert("Par");
            } else {
                alert("Impar");
            }
        }

        function ex09() {
            let n1 = parseFloat(prompt("Ex 9 - Maior numero:\nDigite o primeiro numero:"));
            let n2 = parseFloat(prompt("Digite o segundo numero diferente:"));
            if (n1 > n2) {
                alert("O maior e: " + n1);
            } else {
                alert("O maior e: " + n2);
            }
        }

        function ex10() {
            let n1 = parseFloat(prompt("Ex 10 - Situacao do aluno:\nDigite a 1a nota:"));
            let n2 = parseFloat(prompt("Digite a 2a nota:"));
            let media = (n1 + n2) / 2;
            if (media >= 7) {
                alert("Media: " + media + " - Aprovado");
            } else if (media >= 4) {
                alert("Media: " + media + " - Recuperacao");
            } else {
                alert("Media: " + media + " - Reprovado");
            }
        }

        function ex11() {
            let valor = parseFloat(prompt("Ex 11 - Desconto em uma compra:\nDigite o valor da compra:"));
            if (valor >= 200) {
                let valorFinal = valor - (valor * 0.10);
                alert("Valor final: R$ " + valorFinal.toFixed(2));
            } else {
                alert("Valor final: R$ " + valor.toFixed(2));
            }
        }

        function ex12() {
            let n1 = parseFloat(prompt("Ex 12 - Maior entre tres numeros:\nDigite o primeiro numero:"));
            let n2 = parseFloat(prompt("Digite o segundo numero:"));
            let n3 = parseFloat(prompt("Digite o terceiro numero:"));
            if (n1 >= n2 && n1 >= n3) {
                alert("O maior e: " + n1);
            } else if (n2 >= n1 && n2 >= n3) {
                alert("O maior e: " + n2);
            } else {
                alert("O maior e: " + n3);
            }
        }

        function ex13() {
            let n1 = parseFloat(prompt("Ex 13 - Calculadora:\nDigite o primeiro numero:"));
            let n2 = parseFloat(prompt("Digite o segundo numero:"));
            let opcao = prompt("Opcoes:\n1 - Somar\n2 - Subtrair\n3 - Multiplicar\n4 - Dividir");
            if (opcao === "1") {
                alert("Resultado: " + (n1 + n2));
            } else if (opcao === "2") {
                alert("Resultado: " + (n1 - n2));
            } else if (opcao === "3") {
                alert("Resultado: " + (n1 * n2));
            } else if (opcao === "4") {
                alert("Resultado: " + (n1 / n2));
            } else {
                alert("Opcao invalida");
            }
        }

        function ex14() {
            let metros = parseFloat(prompt("Ex 14 - Conversor de medidas:\nDigite o valor em metros:"));
            let opcao = prompt("Opcoes:\n1 - Converter para centimetros\n2 - Converter para milimetros\n3 - Converter para quilometros");
            if (opcao === "1") {
                alert("Resultado: " + (metros * 100) + " cm");
            } else if (opcao === "2") {
                alert("Resultado: " + (metros * 1000) + " mm");
            } else if (opcao === "3") {
                alert("Resultado: " + (metros / 1000) + " km");
            } else {
                alert("Opcao invalida");
            }
        }

        function ex15() {
            let opcao = prompt("Ex 15 - Cardapio:\n1 - Hamburguer - R$ 15,00\n2 - Cachorro-quente - R$ 12,00\n3 - Pizza - R$ 20,00\n4 - Refrigerante - R$ 6,00");
            let preco = 0;
            if (opcao === "1") {
                preco = 15;
            } else if (opcao === "2") {
                preco = 12;
            } else if (opcao === "3") {
                preco = 20;
            } else if (opcao === "4") {
                preco = 6;
            } else {
                alert("Produto invalido");
                return;
            }
            let qtd = parseInt(prompt("Digite a quantidade:"));
            alert("Valor total: R$ " + (preco * qtd).toFixed(2));
        }

        function ex16() {
            let valor = parseFloat(prompt("Ex 16 - Forma de pagamento:\nDigite o valor da compra:"));
            let opcao = prompt("Formas de pagamento:\n1 - Pix (10% desconto)\n2 - Dinheiro (5% desconto)\n3 - Cartao a vista\n4 - Cartao parcelado (10% acréscimo)");
            if (opcao === "1") {
                alert("Valor final: R$ " + (valor * 0.90).toFixed(2));
            } else if (opcao === "2") {
                alert("Valor final: R$ " + (valor * 0.95).toFixed(2));
            } else if (opcao === "3") {
                alert("Valor final: R$ " + valor.toFixed(2));
            } else if (opcao === "4") {
                alert("Valor final: R$ " + (valor * 1.10).toFixed(2));
            } else {
                alert("Forma de pagamento invalida");
            }
        }

        function ex17() {
            let peso = parseFloat(prompt("Ex 17 - Calculadora de IMC:\nDigite seu peso em kg:"));
            let altura = parseFloat(prompt("Digite sua altura em metros:"));
            let imc = peso / (altura * altura);
            if (imc < 18.5) {
                alert("IMC: " + imc.toFixed(2) + " - Abaixo do peso");
            } else if (imc <= 24.9) {
                alert("IMC: " + imc.toFixed(2) + " - Peso adequado");
            } else if (imc <= 29.9) {
                alert("IMC: " + imc.toFixed(2) + " - Sobrepeso");
            } else {
                alert("IMC: " + imc.toFixed(2) + " - Obesidade");
            }
        }

        function ex18() {
            let idade = parseInt(prompt("Ex 18 - Classificacao de filme:\nDigite sua idade:"));
            let opcao = prompt("Escolha o filme:\n1 - Filme livre\n2 - Filme 12 anos\n3 - Filme 16 anos\n4 - Filme 18 anos");
            if (opcao === "1") {
                alert("Pode assistir");
            } else if (opcao === "2" && idade >= 12) {
                alert("Pode assistir");
            } else if (opcao === "3" && idade >= 16) {
                alert("Pode assistir");
            } else if (opcao === "4" && idade >= 18) {
                alert("Pode assistir");
            } else if (opcao === "2" || opcao === "3" || opcao === "4") {
                alert("Nao possui idade suficiente");
            } else {
                alert("Opcao invalida");
            }
        }

        function ex19() {
            let opcao = prompt("Ex 19 - Posto de combustivel:\n1 - Gasolina - R$ 6,20\n2 - Etanol - R$ 4,30\n3 - Diesel - R$ 6,00");
            let preco = 0;
            let tipo = "";
            if (opcao === "1") {
                preco = 6.20;
                tipo = "Gasolina";
            } else if (opcao === "2") {
                preco = 4.30;
                tipo = "Etanol";
            } else if (opcao === "3") {
                preco = 6.00;
                tipo = "Diesel";
            } else {
                alert("Opcao invalida");
                return;
            }
            let litros = parseFloat(prompt("Digite a quantidade de litros:"));
            let total = preco * litros;
            let desconto = 0;
            if (total > 200) {
                desconto = total * 0.05;
            }
            let valorFinal = total - desconto;
            alert("Tipo: " + tipo + "\nLitros: " + litros + "\nValor sem desconto: R$ " + total.toFixed(2) + "\nDesconto: R$ " + desconto.toFixed(2) + "\nValor final: R$ " + valorFinal.toFixed(2));
        }

        function ex20() {
            let opcaoProd = prompt("Ex 20 - Mini sistema de compras:\n1 - Camiseta - R$ 50,00\n2 - Calca - R$ 100,00\n3 - Tenis - R$ 200,00");
            let preco = 0;
            let produto = "";
            if (opcaoProd === "1") {
                preco = 50;
                produto = "Camiseta";
            } else if (opcaoProd === "2") {
                preco = 100;
                produto = "Calca";
            } else if (opcaoProd === "3") {
                preco = 200;
                produto = "Tenis";
            } else {
                alert("Produto invalido");
                return;
            }
            let qtd = parseInt(prompt("Digite a quantidade:"));
            let subtotal = preco * qtd;
            let opcaoPag = prompt("Forma de pagamento:\n1 - Pix (10% desconto)\n2 - Dinheiro (5% desconto)\n3 - Cartao");
            let desconto = 0;
            if (opcaoPag === "1") {
                desconto = subtotal * 0.10;
            } else if (opcaoPag === "2") {
                desconto = subtotal * 0.05;
            } else if (opcaoPag === "3") {
                desconto = 0;
            } else {
                alert("Forma de pagamento invalida");
                return;
            }
            let totalFinal = subtotal - desconto;
            alert("Produto: " + produto + "\nQuantidade: " + qtd + "\nSubtotal: R$ " + subtotal.toFixed(2) + "\nDesconto: R$ " + desconto.toFixed(2) + "\nValor final: R$ " + totalFinal.toFixed(2));
        }
    </script>
</body>
</html>
